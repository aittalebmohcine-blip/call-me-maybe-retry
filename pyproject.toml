[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Does LLMs speak the language of computers? We’ll find out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.3",
    "llm_sdk",
]

[tool.uv.sources]
llm_sdk = { path = "./llm_sdk" }

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["llm_sdk.*"]
ignore_errors = true
